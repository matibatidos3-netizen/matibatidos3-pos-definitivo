name: Compilar Matibatidos POS Definitivo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Preparar Android SDK existente
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=$ANDROID_HOME"

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager -print -quit)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: No se encontró sdkmanager."
            exit 1
          fi

          echo "Usando: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Localizar y extraer proyecto
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(find . -type f -iname '*.zip' \
            -not -path './.git/*' -print -quit)"

          if [ -z "$ZIP" ]; then
            echo "ERROR: No se encontró el ZIP."
            exit 1
          fi

          mkdir -p proyecto
          unzip -q "$ZIP" -d proyecto

          echo "ZIP extraído: $ZIP"

          find proyecto -maxdepth 5 -type f \
            \( -name settings.gradle \
            -o -name settings.gradle.kts \) -print

      - name: Detectar proyecto Android
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS="$(find proyecto -type f \
            \( -name settings.gradle \
            -o -name settings.gradle.kts \) \
            -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: No se encontró settings.gradle."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Proyecto localizado: $PROJECT_DIR"

      - name: Configurar AndroidX
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          touch gradle.properties

          grep -q '^android.useAndroidX=' gradle.properties \
            || echo 'android.useAndroidX=true' >> gradle.properties

          grep -q '^android.enableJetifier=' gradle.properties \
            || echo 'android.enableJetifier=true' >> gradle.properties

      - name: Compilar APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          gradle --no-daemon --stacktrace assembleDebug

      - name: Verificar APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find proyecto -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: No se generó la APK."
            exit 1
          fi

          echo "APK generada: $APK"

      - name: Descargar APK generada
        uses: actions/upload-artifact@v4
        with:
          name: Matibatidos-POS-APK
          path: proyecto/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
