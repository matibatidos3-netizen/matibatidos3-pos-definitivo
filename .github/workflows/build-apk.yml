name: Construir Matibatidos POS Definitivo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construir:
    name: Compilar APK Matibatidos
    runs-on: ubuntu-latest

    steps:

      # 1. Descargar proyecto
      - name: Descargar repositorio
        uses: actions/checkout@v4

      # 2. Configurar Java 17
      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3. Preparar Gradle 8.7
      - name: Preparar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # 4. Utilizar Android SDK preinstalado
      - name: Verificar Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          if [ ! -d "$SDK" ]; then
            echo "ERROR: No se encontró Android SDK."
            exit 1
          fi

          echo "Android SDK: $SDK"

          echo "Plataformas instaladas:"
          ls "$SDK/platforms" || true

          echo "Build tools instaladas:"
          ls "$SDK/build-tools" || true

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      # 5. Localizar ZIP
      - name: Buscar proyecto ZIP
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ZIPS < <(
            find . -type f -iname '*.zip' \
              -not -path './.git/*'
          )

          if [ "${#ZIPS[@]}" -eq 0 ]; then
            echo "ERROR: No se encontró ningún ZIP."
            exit 1
          fi

          if [ "${#ZIPS[@]}" -ne 1 ]; then
            echo "ERROR: Hay varios ZIP. Deja solamente el proyecto Android que deseas compilar."
            printf '%s\n' "${ZIPS[@]}"
            exit 1
          fi

          echo "ZIP seleccionado: ${ZIPS[0]}"
          echo "ZIP_FILE=${ZIPS[0]}" >> "$GITHUB_ENV"

      # 6. Extraer proyecto
      - name: Extraer proyecto Android
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p proyecto

          unzip -q "$ZIP_FILE" -d proyecto

          echo "Contenido extraído:"
          find proyecto -maxdepth 4 -type f | head -100

      # 7. Detectar directorio Gradle
      - name: Localizar proyecto Android
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS="$(find proyecto -type f \
            \( -name settings.gradle \
            -o -name settings.gradle.kts \) \
            -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: No se encontró settings.gradle."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Proyecto localizado: $PROJECT_DIR"

      # 8. Activar AndroidX
      - name: Configurar AndroidX
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          touch gradle.properties

          grep -q '^android.useAndroidX=' gradle.properties \
            || echo 'android.useAndroidX=true' >> gradle.properties

          grep -q '^android.enableJetifier=' gradle.properties \
            || echo 'android.enableJetifier=true' >> gradle.properties

          echo "AndroidX y Jetifier configurados."

      # 9. Corregir dependencias Kotlin
      - name: Preparar corrección Kotlin
        shell: bash
        run: |
          set -euo pipefail

          cat > "$RUNNER_TEMP/kotlin-fix.gradle" <<'EOF'
          allprojects {
              configurations.configureEach {
                  resolutionStrategy.force(
                      "org.jetbrains.kotlin:kotlin-stdlib:1.8.22",
                      "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22",
                      "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22"
                  )
              }
          }
          EOF

          echo "Corrección Kotlin preparada."

      # 10. Compilar aplicación
      - name: Compilar APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          gradle \
            --no-daemon \
            --stacktrace \
            -I "$RUNNER_TEMP/kotlin-fix.gradle" \
            assembleDebug

      # 11. Verificar resultado
      - name: Verificar APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find proyecto -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: No se encontró la APK."
            exit 1
          fi

          echo "APK generada correctamente:"
          ls -lh "$APK"

      # 12. Guardar APK descargable
      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Matibatidos-POS-APK
          path: proyecto/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
