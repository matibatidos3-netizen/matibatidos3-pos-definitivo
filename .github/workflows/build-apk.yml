name: Preparar SDK de Android
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "ERROR: ANDROID_HOME no está configurado."
            exit 1
          fi

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager -print -quit)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: No se encontró sdkmanager."
            exit 1
          fi

          echo "SDK encontrado: $SDKMANAGER"

          yes | bash "$SDKMANAGER" --licenses || true

          bash "$SDKMANAGER" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "SDK Android preparado correctamente."
