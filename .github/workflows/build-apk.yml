name: Compilar Matibatidos POS de prueba

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Localizar y extraer proyecto Android
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"

          if [ -z "$ZIP" ]; then
            echo "ERROR: No se encontró ningún archivo ZIP en la raíz del repositorio."
            exit 1
          fi

          mkdir -p proyecto
          unzip -q "$ZIP" -d proyecto

          echo "ZIP extraído: $ZIP"
          echo "Buscando Gradle Wrapper..."

          find proyecto -type f -name gradlew -print

      - name: Activar AndroidX y compilar APK
        shell: bash
        run: |
          set -euo pipefail

          GRADLEW="$(find proyecto -type f -name gradlew -print -quit)"

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: No se encontró gradlew dentro del ZIP."
            echo "Revisa que el ZIP contenga el proyecto Android completo."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW")"
          cd "$PROJECT_DIR"

          echo "Proyecto Android encontrado en: $PROJECT_DIR"

          touch gradle.properties

          if ! grep -q '^android.useAndroidX=true$' gradle.properties; then
            echo 'android.useAndroidX=true' >> gradle.properties
          fi

          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Guardar APK de prueba
        uses: actions/upload-artifact@v4
        with:
          name: Matibatidos-APK-PRUEBA
          path: proyecto/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
